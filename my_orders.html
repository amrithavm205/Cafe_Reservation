.order-card{

background:white;

}

.order-card h3{

color:#2b1b12;
margin-bottom:15px;

}

.order-details{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;

}

.detail{

background:#f8f5f2;
padding:15px;
border-radius:10px;

}

.detail strong{
display:block;
margin-bottom:8px;
color:#2b1b12;
}

.status{

display:inline-block;
padding:8px 15px;
border-radius:20px;
font-size:14px;
font-weight:bold;
margin-top:10px;

}

.preparing{
background:#fff3cd;
color:#856404;
}

.completed{
background:#d4edda;
color:#155724;
}

.cancelled{
background:#f8d7da;
color:#721c24;
}

.buttons{

margin-top:25px;

flex-wrap:wrap;

}

.buttons button{

padding:12px 20px;
border:none;
border-radius:8px;

color:white;
transition:.3s;

}

.cancel-btn{

}

.reservation-btn{

}

.buttons button:hover{
