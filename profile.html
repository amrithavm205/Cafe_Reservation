<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Brew&Desk | My Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f8f5f2;

color:#333;

}

/* ================= NAVBAR ================= */

header{

background:#2b1b12;

padding:15px 40px;

position:sticky;

top:0;

z-index:1000;

}

.navbar{

display:flex;

justify-content:space-between;

align-items:center;

}

.logo{

font-size:24px;

font-weight:bold;

color:white;

}

.navbar ul{

display:flex;

list-style:none;

gap:20px;

}

.navbar ul li a{

text-decoration:none;

color:white;

transition:.3s;

}

.navbar ul li a:hover{

color:#c89b6d;

}

.nav-buttons a{

text-decoration:none;

padding:8px 15px;

border-radius:5px;

margin-left:10px;

font-weight:bold;

}

.login-btn{

background:white;

color:#2b1b12;

}

.register-btn{

background:#c89b6d;

color:white;

}

/* ================= HERO ================= */

.hero{

height:35vh;

background:

linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),

url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1600");

background-size:cover;

background-position:center;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

color:white;

}

.hero h1{

font-size:48px;

margin-bottom:10px;

}

.hero p{

font-size:18px;

}

/* ================= PROFILE CARD ================= */

.profile-container{

max-width:900px;

margin:50px auto;

background:white;

padding:40px;

border-radius:15px;

box-shadow:0 10px 25px rgba(0,0,0,.1);

}

.profile-header{

text-align:center;

margin-bottom:30px;

}

.profile-header img{

width:140px;

height:140px;

border-radius:50%;

object-fit:cover;

border:5px solid #c89b6d;

}

.profile-header h2{

margin-top:15px;

color:#2b1b12;

}

.profile-header p{

color:#666;

}

.profile-details{

display:grid;

grid-template-columns:1fr;

gap:20px;

margin-top:30px;

}

.detail-box{

background:#f8f5f2;

padding:20px;

border-radius:10px;

}

.detail-box h4{

color:#2b1b12;

margin-bottom:8px;

}

.detail-box p{

color:#666;

}

.buttons{

margin-top:35px;

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}

.buttons button{

padding:12px 25px;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

transition:.3s;

}

.edit-btn{

background:#2b1b12;

color:white;

}

.orders-btn{

background:#c89b6d;

color:white;

}

.reservation-btn{

background:#3c7a4c;

color:white;

}

.logout-btn{

background:#b22222;

color:white;

}

.buttons button:hover{

opacity:.9;

}

/* ================= FOOTER ================= */

footer{

background:#2b1b12;

color:white;

padding:20px 40px;

margin-top:50px;

}

.footer-content{

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

}

.social-icons a{

color:white;

margin:0 10px;

font-size:20px;

transition:.3s;

}

.social-icons a:hover{

color:#c89b6d;

}


@media(max-width:768px){

.navbar{

flex-direction:column;

gap:15px;

}

.navbar ul{

flex-wrap:wrap;

justify-content:center;

}

.profile-details{

grid-template-columns:1fr;

}

.footer-content{

flex-direction:column;

gap:20px;

text-align:center;

}

}

</style>

</head>

<body>

<header>

<div class="navbar">

<div class="logo">

<i class="fa-solid fa-mug-hot"></i>

 Brew&Desk

</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="menu.html">Menu</a></li>

<li><a href="about.html">About Us</a></li>

<li><a href="reservation.html">Reservation</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

<div class="nav-buttons">

<a href="login.html" class="login-btn">Login</a>

<a href="register.html" class="register-btn">Register</a>

</div>

</div>

</header>

<section class="hero">

<div>

<h1>My Profile</h1>

<p>View and manage your Brew&Desk account details.</p>

</div>

</section>

<div class="profile-container">

<div class="profile-header">

<h2>My Profile</h2>

</div>

<div class="profile-details">

<div class="profile-details">

    <div class="detail-box">
        <h4>
            <i class="fa-solid fa-user"></i>
            Full Name
        </h4>
        <p>Not available yet</p>
    </div>

    <div class="detail-box">
        <h4>
            <i class="fa-solid fa-envelope"></i>
            Email
        </h4>
        <p>Not available yet</p>
    </div>

    <div class="detail-box">
        <h4>
            <i class="fa-solid fa-phone"></i>
            Mobile Number
        </h4>
        <p>Not available yet</p>
    </div>

</div>

</div>

<div class="buttons">

<button class="edit-btn" onclick="editProfile()">

<i class="fa-solid fa-pen"></i>

Edit Profile

</button>


<button class="reservation-btn"
onclick="location.href='my_reservation.html'">

<i class="fa-solid fa-calendar-check"></i>

My Reservations

</button>

<button class="reservation-btn" onclick="location.href='my_orders.html'">
    <i class="fa-solid fa-cart-shopping"></i>
    My Orders
</button>

<button class="logout-btn" onclick="logoutUser()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</div>

</div>

<!-- ================= FOOTER ================= -->

<footer>

<div class="footer-content">

<p>&copy; 2026 Brew&Desk. All Rights Reserved.</p>

<div class="social-icons">

<a href="#"><i class="fab fa-facebook-f"></i></a>

<a href="#"><i class="fab fa-instagram"></i></a>

<a href="#"><i class="fab fa-x-twitter"></i></a>

<a href="#"><i class="fab fa-linkedin-in"></i></a>

</div>

</div>

</footer>

<!-- ================= JAVASCRIPT ================= -->

<script>

// Edit Profile

function editProfile(){

alert("Edit Profile feature will be available after backend integration.");

}

// Logout

function logoutUser(){

if(confirm("Are you sure you want to logout?")){

alert("You have been logged out successfully.");

window.location.href="login.html";

}

}

// Welcome Message

window.onload=function(){

console.log("Welcome to Brew&Desk Profile Page");

};

</script>

</body>

</html>
